project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "de/*.qmd"
  post-render:
    - "python3 scripts/localize.py"
  resources:
    - assets/**
    - apps/**

website:
  title: "Ji Pan"
  description: "Business & Data Analytics Portfolio"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: experience.qmd
        text: Experience
      - href: projects.qmd
        text: Projects
      - href: cv.qmd
        text: CV
    right:
      - href: /index.qmd
        text: English
      - href: /de/index.qmd
        text: Deutsch
      - icon: envelope
        href: "mailto:panj5487666@gmail.com"
        aria-label: Email

  page-footer:
    left: "© 2026 Ji Pan"
    right: "Built with Quarto"

lang: en

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    smooth-scroll: true
    code-fold: true
    code-copy: true
    link-external-newwindow: true

execute:
  freeze: auto
  warning: false
  message: false
